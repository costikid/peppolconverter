<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${title}, ${description}, ${canonicalUrl})"></head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="container py-5">
        <div th:replace="fragments/breadcrumb :: breadcrumb(${breadcrumbItems})"></div>
        <div th:replace="fragments/flash-messages :: flash-messages"></div>

        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">Conversion Complete</h1>
                <p class="lead mb-4">Your FreeAgent invoice has been successfully converted to Peppol BIS Billing 3.0 format.</p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-header">
                        <h2 class="card-title h5 mb-0">Peppol XML Output</h2>
                    </div>
                    <div class="card-body">
                        <pre class="bg-light p-3" style="max-height: 400px; overflow-y: auto;"><code th:text="${xmlOutput}"></code></pre>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/freeagent-to-peppol/download/{sessionId}(sessionId=${sessionId})}" class="btn btn-primary">Download XML</a>
                        <button onclick="copyToClipboard()" class="btn btn-outline-secondary">Copy to Clipboard</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="alert alert-success">
                    <strong>Peppol Compliance:</strong> The generated XML complies with Peppol BIS Billing 3.0 specification.
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12">
                <a href="/freeagent-to-peppol/upload" class="btn btn-secondary">Convert Another Invoice</a>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>

    <script>
        function copyToClipboard() {
            const xmlOutput = document.querySelector('pre code').textContent;
            navigator.clipboard.writeText(xmlOutput).then(() => {
                alert('XML copied to clipboard!');
            }).catch(err => {
                alert('Failed to copy XML');
            });
        }
    </script>
</body>
</html>
