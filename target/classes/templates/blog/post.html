<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${title}, ${description}, ${canonicalUrl})"></head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="container py-5">
        <div th:replace="fragments/breadcrumb :: breadcrumb(${breadcrumbItems})"></div>

        <div class="row">
            <div class="col-lg-8">
                <h1 class="mb-1" th:text="${post.title}"></h1>
                <p class="text-muted small mb-4"
                   th:text="${#temporals.format(post.date, 'dd MMMM yyyy')}"></p>

                <div class="blog-content" th:utext="${post.htmlContent}"></div>

                <hr class="my-5">
                <a href="/blog" class="btn btn-outline-secondary">&larr; Back to Blog</a>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
