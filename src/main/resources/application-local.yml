spring:
  redis:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/peppol_converter
    username: peppol
    password: peppol
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          freeagent:
            client-id: ${FREEAGENT_CLIENT_ID}
            client-secret: ${FREEAGENT_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/freeagent
            scope: https://api.freeagent.com/v2/,offline_access
        provider:
          freeagent:
            authorization-uri: https://api.freeagent.com/v2/approve_app
            token-uri: https://api.freeagent.com/v2/token_endpoint
            user-info-uri: https://api.freeagent.com/v2/users/me
            user-name-attribute: email

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cookie:
    secret: ${COOKIE_SECRET:local-dev-secret-not-for-production}
    secret-previous: ${COOKIE_SECRET_PREVIOUS:}
