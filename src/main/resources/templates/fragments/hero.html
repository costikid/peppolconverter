<section th:fragment="hero(title, subtitle)" class="hero">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h1 th:text="${title}">Page Title</h1>
                <p class="lead" th:if="${subtitle}" th:text="${subtitle}">Subtitle</p>
            </div>
        </div>
    </div>
</section>
