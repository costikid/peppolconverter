<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${title}, ${description}, ${canonicalUrl})"></head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="container-fluid p-0">
        <div th:replace="fragments/hero :: hero('Blog', 'Articles and updates about Peppol e-invoicing')"></div>

        <div class="container py-5">
        <div th:replace="fragments/breadcrumb :: breadcrumb(${breadcrumbItems})"></div>

        <div class="row">
            <div class="col-lg-8">

                <div th:if="${posts.empty}" class="alert alert-info">
                    No posts yet — check back soon.
                </div>

                <div th:each="post : ${posts}" class="card mb-4">
                    <div class="card-body">
                        <h2 class="card-title h5 mb-1">
                            <a th:href="@{/blog/{slug}(slug=${post.slug})}"
                               th:text="${post.title}"
                               class="text-decoration-none"></a>
                        </h2>
                        <p class="text-muted small mb-2"
                           th:text="${#temporals.format(post.date, 'dd MMMM yyyy')}"></p>
                        <p class="card-text text-muted" th:text="${post.summary}"></p>
                        <a th:href="@{/blog/{slug}(slug=${post.slug})}" class="btn btn-sm btn-outline-primary">
                            Read more
                        </a>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
