<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${title}, ${description}, ${canonicalUrl})"></head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="container-fluid p-0">
        <div th:replace="fragments/hero :: hero('Processing Your Invoice', 'Your FreeAgent invoice is being converted to Peppol BIS Billing 3.0 format.')"></div>

        <div class="container py-5">
        <div th:replace="fragments/breadcrumb :: breadcrumb(${breadcrumbItems})"></div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <div class="progress mb-3">
                            <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                 role="progressbar" 
                                 style="width: 100%" 
                                 aria-valuenow="100" 
                                 aria-valuemin="0" 
                                 aria-valuemax="100">
                                Processing...
                            </div>
                        </div>
                        <p class="text-center mb-0">Please wait while we process your invoice.</p>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
