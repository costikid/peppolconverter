<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${title}, ${description}, ${canonicalUrl})"></head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <h1 class="card-title h3 mb-4">Connect Your FreeAgent Account</h1>
                        <p class="card-text mb-4">Link your FreeAgent account to convert invoices directly to Peppol BIS Billing 3.0 XML format.</p>
                        <a href="/oauth2/authorization/freeagent" class="btn btn-primary btn-lg">
                            Connect with FreeAgent
                        </a>
                        <p class="mt-3 text-muted">
                            <small>You'll be redirected to FreeAgent to authorize access to your invoices.</small>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
