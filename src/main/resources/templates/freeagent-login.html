<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${title}, ${description}, ${canonicalUrl})"></head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="container-fluid p-0">
        <div class="hero">
            <div class="container py-5">
                <div class="row justify-content-center">
                    <div class="col-md-8 text-center">
                        <h1>Connect Your FreeAgent Account</h1>
                        <p class="lead">Link your FreeAgent account to browse and convert invoices directly to Peppol BIS Billing 3.0 XML.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body text-center">
                            <a href="/oauth2/authorization/freeagent" class="btn btn-primary btn-lg">
                                Connect with FreeAgent
                            </a>
                            <p class="mt-3 text-muted">
                                <small>You'll be redirected to FreeAgent to authorize access to your invoices.</small>
                            </p>
                        </div>
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger mt-3">
                        Unable to connect to FreeAgent. Please try again.
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
