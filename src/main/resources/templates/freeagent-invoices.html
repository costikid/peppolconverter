<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head(${title}, ${description}, ${canonicalUrl})"></head>
<body>
    <header th:replace="fragments/header :: header"></header>
    <nav th:replace="fragments/nav :: nav"></nav>

    <main class="container-fluid p-0">
        <div class="hero">
            <div class="container py-5">
                <div class="row">
                    <div class="col-12 text-center">
                        <h1>Your FreeAgent Invoices</h1>
                        <p class="lead">Welcome, <span th:text="${userName}">User</span></p>
                    </div>
                </div>
            </div>
        </div>

        <div class="container py-5">
            <div class="row mb-3">
                <div class="col-12 text-end">
                    <a href="/freeagent/my-invoices" class="btn btn-outline-primary btn-sm">View My Converted Invoices</a>
                </div>
            </div>
            <div class="row" th:if="${error}">
                <div class="col-12">
                    <div class="alert alert-danger" th:text="${error}">Error message</div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Reference</th>
                                <th>Date</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="invoice : ${invoices}">
                                <td th:text="${invoice.reference}">INV-001</td>
                                <td th:text="${invoice.datedOn}">2024-01-01</td>
                                <td th:text="${invoice.currency + ' ' + invoice.totalValue}">GBP 100.00</td>
                                <td th:text="${invoice.status}">Open</td>
                                <td>
                                    <a th:href="@{/freeagent/convert/{id}(id=${invoice.url.split('/invoices/')[1]})}" 
                                       class="btn btn-sm btn-primary">
                                        Convert to XML
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <nav aria-label="Page navigation">
                        <ul class="pagination justify-content-center">
                            <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/freeagent/invoices(page=${currentPage - 1})}">Previous</a>
                            </li>
                            <li class="page-item active">
                                <span class="page-link" th:text="'Page ' + ${currentPage}">Page 1</span>
                            </li>
                            <li class="page-item">
                                <a class="page-link" th:href="@{/freeagent/invoices(page=${currentPage + 1})}">Next</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12 text-center">
                    <a href="/freeagent-to-peppol" class="btn btn-outline-secondary">Back to PDF Upload</a>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
